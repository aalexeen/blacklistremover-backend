services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blacklistremover
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d blacklistremover"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: aalexeen/blacklistremover-backend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/blacklistremover
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      WLC1_SSH_HOST: ${WLC1_SSH_HOST}
      WLC1_SSH_PORT: ${WLC1_SSH_PORT}
      WLC2_SSH_HOST: ${WLC2_SSH_HOST}
      WLC2_SSH_PORT: ${WLC2_SSH_PORT}
      WLC_USERNAME: ${WLC_USERNAME}
      WLC_PASSWORD: ${WLC_PASSWORD}
      WLC_ENABLE_PASSWORD: ${WLC_ENABLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: aalexeen/blacklistremover-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
