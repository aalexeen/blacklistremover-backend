databaseChangeLog:
  - changeSet:
      id: create-table-wlc
      author: Aleksandr
      changes:
        - createTable:
            tableName: wlc
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: varchar(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: wlc
            columnNames: name, ip_address
            constraintName: UK_name_ip