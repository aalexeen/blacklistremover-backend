databaseChangeLog:
  - changeSet:
      id: fill-table-wlc
      author: Aleksandr
      changes:
        - loadData:
            encoding: UTF-8
            separator: ;
            quotchar: ''''
            usePreparedStatements: true
            tableName: wlc
            file: ../csv/wlc.csv
            commentLineStartsWith: //
            schemaName: public
            relativeToChangelogFile:  true
            columns:
              - column:
                  header: name
                  name: name
                  type: varchar
              - column:
                  header: description
                  name: description
                  type: varchar
              - column:
                  header: ip_address
                  name: ip_address
                  type: varchar
      rollback:
        - sql:
            sql: DELETE FROM wlc;